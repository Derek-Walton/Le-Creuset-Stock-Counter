<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Filters</h2>
        <button class="filter" id="castIronFilter">Cast Iron</button>
        <button class="filter" id="triplyFilter">3PLY</button>
        <button class="filter" id="tnsFilter">TNS</button>
        <button class="filter" id="stonewareFilter">Stoneware</button>
        <button class="filter" id="mugsFilter">Mugs</button>
        <button class="filter" id="miscellaneousFilter">Miscellaneous</button>
        <button class="filter" id="unassignedFilter">Unassigned</button>
        <button class="filter" id="allFilter">All</button>
    </header>
    <main>
        <section id="left" class="box">
            <section id="inputArea">
                <textarea id="spreadsheetInput" placeholder="Paste Item Data Here"></textarea>
                <div id="button-container">
                    <button id="submitButton">Submit</button>
                    <button id="alphabeticalSort">Alphabetical</button>
                    <button id="quantitySort">Quantity</button>
                    <button id="costSort">Unit Cost</button>
                    <button id="totalCostSort">Total Cost</button>
                </div>
            </section>
            <table id="table">
                <thead>
                    <tr>
                        <th>Item Description</th>
                        <th>Quantity</th>
                        <th>Avg Cost</th>
                        <th>Total Cost</th>
                        <th>Ordered</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Output will go here -->
                </tbody>
            </table>
        </section>

        <section id="right">
            <section id="top" class="box">
                <h2 id="filterTitle">All</h2>
                <div class="dashboardItem">
                    <h3>Total Quantity</h3>
                    <p id="totalQuantityStat">0 Units</p>
                </div>
                <div class="dashboardItem">
                    <h3>Total Cost</h3>
                    <p id="totalCostStat">£0</p>
                </div>
                <div class="dashboardItem">
                    <h3>Average Cost</h3>
                    <p id="avgCostStat">£0</p>
                </div>
                <canvas id="barChart"></canvas> <!-- Work in Progress Here -->
            </section>

            <section id="bottom" class="box">
                <h2>Revenue Split</h2>
                <div class="dashboardItem">
                    <h3>Cast Iron</h3>
                    <p id="castIronPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>3PLY</h3>
                    <p id="triplyPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>TNS</h3>
                    <p id="tnsPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>Stoneware</h3>
                    <p id="stonewarePercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>Miscellaneous</h3>
                    <p id="miscellaneousPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>Unassigned</h3>
                    <p id="unassignedPercentage">0%</p>
                </div>
                <canvas id="chartContainer"></canvas>
                <p id="errorPercentage">Margin of Error: 0%</p>
            </section>
        </section>
    </main>
</body>
<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</html>
