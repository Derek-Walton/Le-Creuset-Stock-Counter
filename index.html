<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Filters</h2>
        <button class="filter" id="castIron">Cast Iron</button>
        <button class="filter" id="triply">3PLY</button>
        <button class="filter" id="tns">TNS</button>
        <button class="filter" id="stoneware">Stoneware</button>
        <button class="filter" id="mugs">Mugs</button>
        <button class="filter" id="miscellaneous">Miscellaneous</button>
        <button class="filter" id="seasonal">Seasonal</button>
        <button class="filter" id="all">All</button>
    </header>
    <main>
        <section id="left" class="box">
            <section id="inputArea">
                <textarea id="spreadsheetData" placeholder="Paste Item Data Here"></textarea>
                <div id="button-container">
                    <button id="submit">Submit</button>
                    <button id="alphabeticalButton">Alphabetical</button>
                    <button id="quantityButton">Quantity</button>
                    <button id="totalCostButton">Total Cost</button>
                </div>
            </section>
            <section id="outputArea">
                <table>
                    <thead>
                        <tr>
                            <th>Item Description</th>
                            <th>Quantity</th>
                            <th>Total Cost</th>
                            <th>Ordered</th>
                        </tr>
                    </thead>
                    <tbody id="output">
                        <!-- Output will go here -->
                    </tbody>
                </table>
            </section>
        </section>

        <section id="right">
            <section id="top" class="box">
                <div class="dashboardItem">
                    <h3>Total Quantity</h3>
                    <p id="totalQuantity">0 Units</p>
                </div>
                <div class="dashboardItem">
                    <h3>Total Cost</h3>
                    <p id="totalCost">£0</p>
                </div>
                <div class="dashboardItem">
                    <h3>Average Cost</h3>
                    <p id="avgCost">£0</p>
                </div>
                <!-- <div class="dashboardItem">
                    <h3>Most Popular</h3>
                    <p id="mostPopular">LC Mug Volcanic</p>
                </div>
                <div class="dashboardItem">
                    <h3>Least Popular</h3>
                    <p id="leastPopular">Wine Sleeve</p>
                </div> -->
            </section>

            <section id="bottom" class="box">
                <h2>Revenue Percentage</h2>
                <div class="dashboardItem">
                    <h3>Cast Iron</h3>
                    <p id="castIronPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>3PLY</h3>
                    <p id="triplyPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>TNS</h3>
                    <p id="tnsPercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>Stoneware</h3>
                    <p id="stonewarePercentage">0%</p>
                </div>
                <div class="dashboardItem">
                    <h3>Miscellaneous</h3>
                    <p id="miscellaneousPercentage">0%</p>
                </div>
                <canvas id="chartContainer"></canvas>
            </section>
        </section>
    </main>
</body>
<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</html>
